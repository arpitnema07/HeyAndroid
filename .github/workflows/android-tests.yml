name: Android tests

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: Unit, integration and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the build to a JDK 25 toolchain.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads an Android runtime jar per SDK the first time; it
      # lands in ~/.m2, which the Gradle cache does not cover.
      - name: Cache Robolectric's Android runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      # Everything runs on the JVM: unit tests, the Room-backed integration tests
      # and the Compose UI tests through Robolectric, so no emulator is needed.
      - name: Run the tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Generate the coverage report
        run: ./gradlew coverageReport --stacktrace

      - name: Add the coverage summary to the run
        if: always()
        run: python3 scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/coverageReport/html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
